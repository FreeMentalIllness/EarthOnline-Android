[versions]
agp = "8.5.2"
# v1.0.6.5：2.0.21 → 2.1.21。Inferkt（llama.cpp KMP 绑定，本地离线推理）要求 2.1.21 metadata。
kotlin = "2.1.21"
# v1.0.6.5：KSP 跟随 Kotlin 2.1.21（2.1.21-2.0.1）；gradle.properties 中 ksp.useKSP2=false
# 强制走 KSP1 引擎，保 Room 2.6.1 / Hilt 的 KSP1 处理器不被 KSP2 破坏。
ksp = "2.1.21-2.0.1"
coreKtx = "1.13.1"
coreSplashscreen = "1.0.1"
lifecycle = "2.8.5"
activityCompose = "1.9.2"
composeBom = "2024.10.01"
navigationCompose = "2.8.4"
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"
room = "2.6.1"
datastore = "1.1.1"
coil = "2.7.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
# v1.0.3：9.1.0 → 10.0.600。真实崩溃日志定位：v9.1.0 引擎在 Android 12+（模拟器实测 API 37）
# 上 GlyphLoader 反射 isHighTextContrastEnabled 失败 → 引擎初始化异常（用户真机上致命闪退）。
# v10 线是官方兼容性修复渠道，包名 com.amap.api.maps 不变，代码零改动。
# v1.0.6.5：3dmap 10.0.600 与 search 9.7.1 分包会因 AMapUtilCoreApi/NetProxy 重复类阻断 dex 合并，
# 改用官方组合包 3dmap-location-search（map 10.0.1000 + loc 6.4.8 + search 9.7.4 单包集成，零冲突）。
amap = "10.0.1000_loc6.4.8_sea9.7.4"
material = "1.11.0"
workmanager = "2.9.1"
# v1.0.6：笔记系统富文本编辑器。1.0.0-rc10 锁定 Compose 1.7.0 与本项目 BOM 2024.10.01 对齐；
# v1.0.6.5：项目 Kotlin 升 2.1.21（Inferkt 要求）——rc10 为 2.0 metadata，新编译器向后兼容，不受影响。
richEditor = "1.0.0-rc10"
# v1.0.6.5：本地离线推理引擎（llama.cpp 的 Kotlin Multiplatform 绑定，Maven Central 发布，
# 内含 Android 预编译 .so；CPU 推理 GGUF 模型，Qwen2.5-1.5B q4_k_m 量级无压力）
inferkt = "0.0.2"
# vc64：Haze（dev.chrisbanes.haze）—— 全局液态玻璃的**工业级实现**（blur + tint + noise）。
# ⚠️ 版本锁 1.3.1 是硬约束，勿随手升级：本项目 Compose BOM 为 2024.10.01（Compose 运行时 1.7.x），
#    而 Haze 1.6.x 起编译时对齐 Compose 1.8.0、2.x/3.x 更是要求 Kotlin 2.4 + Compose 1.12，
#    会直接引发「编译期 API 缺失 / metadata 版本不兼容」的连锁崩（AGP、KSP、Room、Hilt 全要跟着升）。
#    1.3.1 的 POM 明确对齐 Compose 1.7.3 + Kotlin 2.1.0，与本项目栈完全同源。
haze = "1.3.1"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# WorkManager（到期提醒后台任务）
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
# Hilt 对 WorkManager Worker 的注入支持（自有版本线，与 hilt 主版本解耦）
hiltWork = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# 高德地图 Android SDK（足迹地图 + POI 搜索，组合包 3dmap-location-search）
# 注意：库键名不能用 amap-3dmap —— Gradle 会把 '-' 转成访问器里的 '.'，
# 生成 libs.amap.3dmap，而 '3dmap' 以数字开头不是合法标识符。改用 amap。
amap = { group = "com.amap.api", name = "3dmap-location-search", version.ref = "amap" }
# v1.0.6：笔记系统 Markdown 富文本编辑器（加粗/列表/标题/代码块/图片插入，支持 MD 导入导出）
richeditor = { group = "com.mohamedrejeb.richeditor", name = "richeditor-compose", version.ref = "richEditor" }
# v1.0.6.5：本地离线推理（llama.cpp 绑定，GGUF 模型；预编译 so 随包分发，无需 NDK 自编译）
inferkt = { group = "com.dilivva", name = "inferkt", version.ref = "inferkt" }
# vc64：全局液态玻璃（Haze）—— 取代 vc62 手写 AGSL 折射与 Modifier.blur 灰块实现
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
